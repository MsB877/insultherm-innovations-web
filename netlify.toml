[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/tds/*"
  [headers.values]
    Content-Type = "application/pdf"
    Content-Disposition = "inline"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# SPA client-side routing fallback (static files in /tds/ and /assets/ are served directly first)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
