<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/brand/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InsulTherm Innovations | Advanced Thermal, Dielectric &amp; 1,100°C Runaway Containment Materials</title>
    <meta
      name="description"
      content="India's rapid-turn digital CNC converter and specialty compounder of thermal interface materials (TIMs), 1,100°C nanoporous aerogel-mica fire barriers, 3D dielectric busbar origami, and ASTM E595 pyrolytic graphite spreaders. CAD-to-part in 24-48 hours with ₹0 tooling NRE."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-orange-600 selection:text-white overflow-x-hidden">
    <!-- Hidden Netlify Forms blueprints for automated build-time form registration -->
    <form name="product-order-inquiry" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="routing_destination" />
      <input type="text" name="product_name" />
      <input type="text" name="selected_variant" />
      <input type="text" name="pricing_tier" />
      <input type="text" name="quantity" />
      <input type="text" name="dimensions_cad" />
      <input type="text" name="full_name" />
      <input type="email" name="work_email" />
      <input type="text" name="company_organization" />
      <input type="text" name="phone_number" />
      <input type="text" name="industry_sector" />
      <textarea name="engineering_notes"></textarea>
    </form>

    <form name="contact-engineering" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="routing_destination" />
      <input type="text" name="full_name" />
      <input type="email" name="work_email" />
      <input type="text" name="company_organization" />
      <input type="text" name="phone_number" />
      <input type="text" name="inquiry_type" />
      <input type="text" name="product_interest" />
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
